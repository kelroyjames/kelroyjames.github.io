<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you: Kelroy James</title>
  <meta name="description" content="Thanks for getting in touch. I'll reply directly.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://kelroyjames.com/thank-you">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#EDEEF0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1119" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/publicsans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/spectral-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
  :root{
    --ground:#EDEEF0; --surface:#FFFFFF; --surface-2:#F4F5F7;
    --ink:#131C28; --ink-2:#3A4753; --muted:#56636F;
    --rule:#D4D8DD; --rule-soft:#E4E7EA;
    --brass:#7A5C24; --brass-soft:#F2ECDF;
    --navy:#24405C; --navy-soft:#E4EAF1;
    --shadow:0 1px 2px rgba(19,28,40,.06), 0 10px 30px rgba(19,28,40,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0B1119; --surface:#131B24; --surface-2:#18212B;
      --ink:#E2E7EC; --ink-2:#B4C0CB; --muted:#828F9B;
      --rule:#27333F; --rule-soft:#1F2A34;
      --brass:#C9A257; --brass-soft:#2A2317;
      --navy:#83A6C7; --navy-soft:#182533;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;margin:0}
  body{
    background:var(--ground);color:var(--ink);
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 26px}
  a{color:var(--navy);text-decoration-thickness:1px;text-underline-offset:3px}
  a:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
  .nav{border-bottom:1px solid var(--rule);background:var(--surface)}
  .nav .wrap{display:flex;align-items:center;padding-top:15px;padding-bottom:15px}
  .mark{font-family:Spectral,Georgia,serif;font-weight:700;font-size:1.45rem;letter-spacing:-.015em;color:var(--ink);text-decoration:none}
  main{padding:96px 0}
  h1{font-family:Spectral,Georgia,serif;font-weight:700;font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.15;margin:0 0 18px}
  p{color:var(--ink-2);font-size:16px;margin:0 0 14px;max-width:56ch}
  .btn{
    display:inline-block;margin-top:14px;padding:11px 22px;text-decoration:none;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid var(--ink);color:var(--ink);background:transparent;
  }
  .btn:hover{background:var(--brass);border-color:var(--brass);color:var(--surface)}
  footer{padding:34px 0 56px}
  footer p{font-size:12.5px;color:var(--muted);max-width:74ch;margin:0}
  </style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <div class="wrap">
    <a class="mark" href="/">Kelroy James</a>
  </div>
</nav>
<main id="main" tabindex="-1">
  <div class="wrap">
    <h1>Thanks — that's sent.</h1>
    <p>I reply to everything myself, usually within a day or two. If it's urgent, email <a href="mailto:kelroydbjames@gmail.com">kelroydbjames@gmail.com</a> directly.</p>
    <a class="btn" href="/">Back to the homepage →</a>
  </div>
</main>
<footer>
  <div class="wrap">
    <p>© Kelroy James</p>
  </div>
</footer>
</body>
</html>
